document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 align-items: baseline; gap: 16px; border-bottom: 1px solid #BAC3BD; padding-bottom: 12px;\">\n      <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;\">01 · Licht en donker<\u002Fspan>\n      <span style=\"font-size: 14px; color: #5C7480;\">Zelfde tekening, alleen de letterkleur wisselt<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 20px;\">\n      <div style=\"flex: 1 1 320px; background: #DFE4E0; border: 1px solid #C7CFC9; padding: 52px 30px; display: flex; flex-direction: column; align-items: center; gap: 22px;\">\n        <svg sc-camel-view-box=\"11 7 138 52\" height=\"66\" fill=\"none\" stroke=\"#1F3540\" stroke-width=\"6\" style=\"display: block;\">\n          <path d=\"M14 54 V14 L50 46 V10\"><\u002Fpath>\n          <path d=\"M50 46 L62.4 57\" stroke-width=\"2\" stroke=\"#C79A3E\"><\u002Fpath>\n          <circle cx=\"78\" cy=\"41\" r=\"13\"><\u002Fcircle>\n          <path d=\"M104 54 V29\"><\u002Fpath>\n          <path d=\"M104 37 C104 29 110 27 119 27.5\"><\u002Fpath>\n          <path d=\"M131 54 V29\"><\u002Fpath>\n          <path d=\"M131 37 C131 29 137 27 146 27.5\"><\u002Fpath>\n        <\u002Fsvg>\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5C7480;\">norr-logotype-fjord.svg · #1F3540<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 320px; background: #0E1A1F; padding: 52px 30px; display: flex; flex-direction: column; align-items: center; gap: 22px;\">\n        <svg sc-camel-view-box=\"11 7 138 52\" height=\"66\" fill=\"none\" stroke=\"#DFE4E0\" stroke-width=\"6\" style=\"display: block;\">\n          <path d=\"M14 54 V14 L50 46 V10\"><\u002Fpath>\n          <path d=\"M50 46 L62.4 57\" stroke-width=\"2\" stroke=\"#C79A3E\"><\u002Fpath>\n          <circle cx=\"78\" cy=\"41\" r=\"13\"><\u002Fcircle>\n          <path d=\"M104 54 V29\"><\u002Fpath>\n          <path d=\"M104 37 C104 29 110 27 119 27.5\"><\u002Fpath>\n          <path d=\"M131 54 V29\"><\u002Fpath>\n          <path d=\"M131 37 C131 29 137 27 146 27.5\"><\u002Fpath>\n        <\u002Fsvg>\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A8B9BB;\">norr-logotype-sno.svg · #DFE4E0<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 320px; background: #1F3540; padding: 52px 30px; display: flex; flex-direction: column; align-items: center; gap: 22px;\">\n        <svg sc-camel-view-box=\"11 7 138 52\" height=\"66\" fill=\"none\" stroke=\"#DFE4E0\" stroke-width=\"6\" style=\"display: block;\">\n          <path d=\"M14 54 V14 L50 46 V10\"><\u002Fpath>\n          <path d=\"M50 46 L62.4 57\" stroke-width=\"2\" stroke=\"#C79A3E\"><\u002Fpath>\n          <circle cx=\"78\" cy=\"41\" r=\"13\"><\u002Fcircle>\n          <path d=\"M104 54 V29\"><\u002Fpath>\n          <path d=\"M104 37 C104 29 110 27 119 27.5\"><\u002Fpath>\n          <path d=\"M131 54 V29\"><\u002Fpath>\n          <path d=\"M131 37 C131 29 137 27 146 27.5\"><\u002Fpath>\n        <\u002Fsvg>\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A8B9BB;\">op Fjord · #1F3540<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin: 0; max-width: 78ch; font-size: 15px; line-height: 1.6; color: #2C3E45; text-wrap: pretty;\">Voor web en app is er ook <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px;\">norr-logotype-currentcolor.svg<\u002Fspan>: die neemt de tekstkleur over, dus één bestand volstaat voor beide modi. De peillijn blijft in alle versies Mässing.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"padding: 68px 72px 0; display: flex; flex-direction: column; gap: 26px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid #BAC3BD; padding-bottom: 12px;\">\n      <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;\">02 · Constructie<\u002Fspan>\n      <span style=\"font-size: 14px; color: #5C7480;\">Alles op een 64-eenheden grid<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 20px;\">\n      <div style=\"flex: 1 1 420px; background: #EDF0EC; border: 1px solid #C7CFC9; padding: 34px 30px;\">\n        <svg sc-camel-view-box=\"4 2 152 62\" height=\"150\" style=\"display: block; width: 100%;\">\n          <path d=\"M14 2 V64 M50 2 V64 M78 2 V64 M104 2 V64 M131 2 V64\" stroke=\"#C7CFC9\" stroke-width=\".6\" fill=\"none\"><\u002Fpath>\n          <path d=\"M4 14 H156 M4 28 H156 M4 41 H156 M4 54 H156\" stroke=\"#C7CFC9\" stroke-width=\".6\" fill=\"none\"><\u002Fpath>\n          <g fill=\"none\" stroke=\"#1F3540\" stroke-width=\"6\">\n            <path d=\"M14 54 V14 L50 46 V10\"><\u002Fpath>\n            <path d=\"M50 46 L62.4 57\" stroke-width=\"2\" stroke=\"#C79A3E\"><\u002Fpath>\n            <circle cx=\"78\" cy=\"41\" r=\"13\"><\u002Fcircle>\n            <path d=\"M104 54 V29\"><\u002Fpath>\n            <path d=\"M104 37 C104 29 110 27 119 27.5\"><\u002Fpath>\n            <path d=\"M131 54 V29\"><\u002Fpath>\n            <path d=\"M131 37 C131 29 137 27 146 27.5\"><\u002Fpath>\n          <\u002Fg>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 14px; padding-top: 6px;\">\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #2C3E45; text-wrap: pretty;\">Lijndikte 6 eenheden, overal gelijk; alleen de peillijn is 2. Kaphoogte 40 (van 14 tot 54), x-hoogte 26 (van 28 tot 54). De o is een zuivere cirkel met radius 13, de r'en zijn stam plus schouder met dezelfde bocht.<\u002Fp>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #2C3E45; text-wrap: pretty;\">De rechterstam van de N loopt 4 eenheden boven de kaphoogte door en de peillijn 3 onder de basislijn: dat is het enige asymmetrische in de tekening en tegelijk het herkenningspunt.<\u002Fp>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #5C7480; text-wrap: pretty;\">Uiteinden zijn recht afgesneden (butt caps), nooit rond. Wie het logo naschaalt houdt de lijndikte proportioneel — behalve in de kleine variant, waar die opzettelijk zwaarder is.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding: 68px 72px 0; display: flex; flex-direction: column; gap: 26px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid #BAC3BD; padding-bottom: 12px;\">\n      <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;\">03 · Maten, icoon en favicon<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 20px;\">\n      <div style=\"flex: 1 1 300px; background: #EDF0EC; border: 1px solid #C7CFC9; padding: 26px; display: flex; flex-direction: column; gap: 18px;\">\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #5C7480;\">Klein · zwaardere lijn<\u002Fdiv>\n        <div style=\"display: flex; align-items: flex-end; gap: 24px; color: #0E1A1F;\">\n          <svg sc-camel-view-box=\"11 7 145 54\" height=\"32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"7\" style=\"display: block;\">\n            <path d=\"M14 54 V14 L50 46 V10\"><\u002Fpath>\n            <path d=\"M50 46 L62.4 57\" stroke-width=\"3\" stroke=\"#C79A3E\"><\u002Fpath>\n            <circle cx=\"78\" cy=\"41\" r=\"13\"><\u002Fcircle>\n            <path d=\"M104 54 V29\"><\u002Fpath>\n            <path d=\"M104 37 C104 29 110 27 119 27.5\"><\u002Fpath>\n            <path d=\"M131 54 V29\"><\u002Fpath>\n            <path d=\"M131 37 C131 29 137 27 146 27.5\"><\u002Fpath>\n          <\u002Fsvg>\n          <svg sc-camel-view-box=\"11 7 145 54\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"8\" style=\"display: block;\">\n            <path d=\"M14 54 V14 L50 46 V10\"><\u002Fpath>\n            <path d=\"M50 46 L62.4 57\" stroke-width=\"3.5\" stroke=\"#C79A3E\"><\u002Fpath>\n            <circle cx=\"78\" cy=\"41\" r=\"13\"><\u002Fcircle>\n            <path d=\"M104 54 V29\"><\u002Fpath>\n            <path d=\"M104 37 C104 29 110 27 119 27.5\"><\u002Fpath>\n            <path d=\"M131 54 V29\"><\u002Fpath>\n            <path d=\"M131 37 C131 29 137 27 146 27.5\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #2C3E45;\">Onder 34px hoogte gaat de lijn omhoog; de peillijn blijft altijd staan. Absolute ondergrens 18px hoog en 46px breed.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 300px; background: #EDF0EC; border: 1px solid #C7CFC9; padding: 26px; display: flex; flex-direction: column; gap: 18px;\">\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #5C7480;\">Los icoon · transparant<\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 22px;\">\n          <div style=\"color: #1F3540;\"><svg sc-camel-view-box=\"0.5 5.5 63 53\" height=\"54\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"7\" style=\"display: block;\"><path d=\"M14 54 V14 L50 46 V10\"><\u002Fpath><path d=\"M50 46 L62.4 57\" stroke-width=\"3\" stroke=\"#C79A3E\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div style=\"background: #0E1A1F; padding: 12px; color: #DFE4E0;\"><svg sc-camel-view-box=\"0.5 5.5 63 53\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"7\" style=\"display: block;\"><path d=\"M14 54 V14 L50 46 V10\"><\u002Fpath><path d=\"M50 46 L62.4 57\" stroke-width=\"3\" stroke=\"#C79A3E\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #2C3E45;\">De losse N voor app-icoon, borduur, stempel en profielfoto's — altijd met de peillijn. Transparant, dus je zet hem zelf op Fjord, Natt of Snö.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 300px; background: #EDF0EC; border: 1px solid #C7CFC9; padding: 26px; display: flex; flex-direction: column; gap: 18px;\">\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #5C7480;\">Favicon · vol vlak<\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 16px;\">\n          <div style=\"width: 48px; height: 48px; background: #1F3540; display: flex; align-items: center; justify-content: center; color: #DFE4E0;\">\n            <svg sc-camel-view-box=\"0 0 64 64\" width=\"39\" height=\"39\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"9\" style=\"display: block;\"><path d=\"M14 54 V14 L50 46 V10\"><\u002Fpath><path d=\"M50 46 L62.4 57\" stroke-width=\"5\" stroke=\"#C79A3E\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"width: 32px; height: 32px; background: #1F3540; display: flex; align-items: center; justify-content: center; color: #DFE4E0;\">\n            <svg sc-camel-view-box=\"0 0 64 64\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"9\" style=\"display: block;\"><path d=\"M14 54 V14 L50 46 V10\"><\u002Fpath><path d=\"M50 46 L62.4 57\" stroke-width=\"5\" stroke=\"#C79A3E\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"width: 16px; height: 16px; background: #1F3540; display: flex; align-items: center; justify-content: center; color: #DFE4E0;\">\n            <svg sc-camel-view-box=\"0 0 64 64\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"10\" style=\"display: block;\"><path d=\"M14 54 V14 L50 46 V10\"><\u002Fpath><path d=\"M50 46 L62.4 57\" stroke-width=\"6\" stroke=\"#C79A3E\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5C7480;\">48 · 32 · 16<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #2C3E45;\">Dezelfde N met peillijn, alleen zwaarder van lijn, in een vol vlak Fjord zodat hij op elk browsertabblad staat. Geleverd op 32 en 16px.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding: 68px 72px 0; display: flex; flex-direction: column; gap: 26px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid #BAC3BD; padding-bottom: 12px;\">\n      <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;\">04 · Kleuren in het merk<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 2px;\">\n      <div style=\"flex: 1 1 200px; min-width: 190px; background: #0E1A1F; padding: 24px 20px 20px; min-height: 132px; display: flex; flex-direction: column; justify-content: space-between;\">\n        <div style=\"font-family: 'Familjen Grotesk', sans-serif; font-size: 18px; font-weight: 600; color: #DFE4E0;\">Natt<\u002Fdiv>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1.6; color: #A8B9BB;\">#0E1A1F<br>Oude tekstkleur — vervangen door Fjord<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 200px; min-width: 190px; background: #DFE4E0; border: 1px solid #C7CFC9; padding: 24px 20px 20px; min-height: 132px; display: flex; flex-direction: column; justify-content: space-between;\">\n        <div style=\"font-family: 'Familjen Grotesk', sans-serif; font-size: 18px; font-weight: 600; color: #0E1A1F;\">Snö<\u002Fdiv>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1.6; color: #2C3E45;\">#DFE4E0<br>Letters op donker, lichte vlakken<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 200px; min-width: 190px; background: #1F3540; padding: 24px 20px 20px; min-height: 132px; display: flex; flex-direction: column; justify-content: space-between;\">\n        <div style=\"font-family: 'Familjen Grotesk', sans-serif; font-size: 18px; font-weight: 600; color: #DFE4E0;\">Fjord<\u002Fdiv>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1.6; color: #A8B9BB;\">#1F3540<br>Letters op licht, faviconvlak<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 200px; min-width: 190px; background: #C79A3E; padding: 24px 20px 20px; min-height: 132px; display: flex; flex-direction: column; justify-content: space-between;\">\n        <div style=\"font-family: 'Familjen Grotesk', sans-serif; font-size: 18px; font-weight: 600; color: #0E1A1F;\">Mässing<\u002Fdiv>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1.6; color: #2C3E45;\">#C79A3E<br>Uitsluitend de peillijn<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin: 0; max-width: 78ch; font-size: 15px; line-height: 1.6; color: #2C3E45; text-wrap: pretty;\">Messing is in het logo alleen de peillijn — niet de letters, niet een vlak. Verder in het merk staat die kleur voor richting, focus of een gemeten waarde; statuskleuren voor goed en fout staan er los van.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"padding: 68px 72px 0; display: flex; flex-direction: column; gap: 26px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid #BAC3BD; padding-bottom: 12px;\">\n      <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;\">05 · Vrije ruimte en wat niet mag<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 26px;\">\n      <div style=\"flex: 1 1 300px; background: #EDF0EC; border: 1px solid #C7CFC9; padding: 26px; display: flex; flex-direction: column; gap: 16px;\">\n        <div style=\"border: 1px dashed #A8B9BB; padding: 22px; display: flex; align-items: center; justify-content: center;\">\n          <div style=\"border: 1px solid #C79A3E; padding: 11px; color: #0E1A1F;\">\n            <svg sc-camel-view-box=\"11 7 145 54\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"7\" style=\"display: block;\">\n              <path d=\"M14 54 V14 L50 46 V10\"><\u002Fpath>\n              <path d=\"M50 46 L62.4 57\" stroke-width=\"3\" stroke=\"#C79A3E\"><\u002Fpath>\n              <circle cx=\"78\" cy=\"41\" r=\"13\"><\u002Fcircle>\n              <path d=\"M104 54 V29\"><\u002Fpath>\n              <path d=\"M104 37 C104 29 110 27 119 27.5\"><\u002Fpath>\n              <path d=\"M131 54 V29\"><\u002Fpath>\n              <path d=\"M131 37 C131 29 137 27 146 27.5\"><\u002Fpath>\n            <\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #2C3E45;\">Rondom minimaal de halve hoogte van de N vrijhouden, aan alle vier de zijden. De uitstekende top van de rechterstam en de peillijn tellen mee als rand.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 380px; background: #EDF0EC; border: 1px solid #C7CFC9; padding: 26px;\">\n        <ul style=\"margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.75; color: #2C3E45;\">\n          <li>Niet roteren, spiegelen of schuinzetten — de richting is de betekenis.<\u002Fli>\n          <li>Letters nooit herzetten of opnieuw spatiëren; dit is een tekening, geen font.<\u002Fli>\n          <li>Geen gradient, schaduw, glans of omlijning.<\u002Fli>\n          <li>De losse N nooit naast de volledige naam plaatsen.<\u002Fli>\n          <li>Messing niet voor de letters en niet als achtergrondvlak.<\u002Fli>\n          <li>Nooit direct op een foto: altijd op Natt, Fjord of Snö.<\u002Fli>\n          <li>Geen tagline in het logo vastzetten.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding: 68px 72px 110px; display: flex; flex-direction: column; gap: 26px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid #BAC3BD; padding-bottom: 12px;\">\n      <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;\">06 · Bestanden<\u002Fspan>\n      <span style=\"font-size: 14px; color: #5C7480;\">SVG, transparant, in de map assets<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 1px; background: #C7CFC9; border: 1px solid #C7CFC9;\">\n      <div style=\"background: #EDF0EC; padding: 15px 20px; display: flex; flex-wrap: wrap; gap: 6px 26px; justify-content: space-between;\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px;\">norr-logotype-fjord.svg<\u002Fspan>\n        <span style=\"font-size: 14px; color: #2C3E45;\">Volledig logo in Fjord — voor lichte ondergronden<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background: #EDF0EC; padding: 15px 20px; display: flex; flex-wrap: wrap; gap: 6px 26px; justify-content: space-between;\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px;\">norr-logotype-sno.svg<\u002Fspan>\n        <span style=\"font-size: 14px; color: #2C3E45;\">Volledig logo in Snö — voor donkere ondergronden<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background: #EDF0EC; padding: 15px 20px; display: flex; flex-wrap: wrap; gap: 6px 26px; justify-content: space-between;\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px;\">norr-logotype-currentcolor.svg<\u002Fspan>\n        <span style=\"font-size: 14px; color: #2C3E45;\">Neemt de tekstkleur over — één bestand voor web en app<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background: #EDF0EC; padding: 15px 20px; display: flex; flex-wrap: wrap; gap: 6px 26px; justify-content: space-between;\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px;\">norr-logotype-klein.svg<\u002Fspan>\n        <span style=\"font-size: 14px; color: #2C3E45;\">Onder 34px hoog: zwaardere lijn, mét peillijn<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background: #EDF0EC; padding: 15px 20px; display: flex; flex-wrap: wrap; gap: 6px 26px; justify-content: space-between;\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px;\">norr-icoon-n.svg<\u002Fspan>\n        <span style=\"font-size: 14px; color: #2C3E45;\">Losse N met peillijn, transparant — app-icoon, stempel, borduur<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background: #EDF0EC; padding: 15px 20px; display: flex; flex-wrap: wrap; gap: 6px 26px; justify-content: space-between;\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px;\">norr-favicon-32.svg · norr-favicon-16.svg<\u002Fspan>\n        <span style=\"font-size: 14px; color: #2C3E45;\">Favicon: N met peillijn in Snö op een vol vlak Fjord<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background: #EDF0EC; padding: 15px 20px; display: flex; flex-wrap: wrap; gap: 6px 26px; justify-content: space-between;\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px;\">LEESMIJ.txt<\u002Fspan>\n        <span style=\"font-size: 14px; color: #2C3E45;\">Maten, vrije ruimte en verbodsregels in tekstvorm<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin: 0; max-width: 78ch; font-size: 15px; line-height: 1.6; color: #2C3E45; text-wrap: pretty;\">Alle bestanden zijn vector en hebben geen achtergrond, behalve de favicons — die hebben het Natt-vlak nodig om op een tabblad te werken. Wil je ook PNG's op vaste maten of een ICO voor oudere browsers, zeg het dan.<\u002Fp>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
