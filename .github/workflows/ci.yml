name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build @yourorg/ui
        # The app depends on packages/ui's built dist/ output (types +
        # runtime), same as any other npm dependency — not source
        # transpilation — so it must exist before lint/typecheck/build run
        # against the app. `npm run typecheck`/`npm run build` below also
        # each rebuild it themselves via their own `pre*` script (see root
        # package.json), so this step is redundant with whichever of those
        # runs first — kept as its own explicit, clearly-labeled step so a
        # failure here (a real bug in the design system) doesn't get
        # attributed to "lint" or buried in another step's log.
        run: npm run build -w @yourorg/ui

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Dummy values so `next build` can complete without a real
          # Supabase project. Real values live in Vercel project settings.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
